<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog</title>
<link id="favicon-link" rel="icon" href="/assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#14231F; --paper:#FAF7F0; --teal:#1F5F52; --gold:#C98A2C; --sage:#6B7B75; --line:#DDD5C4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5; }
  h1,h2,h3 { font-family:'Fraunces',serif; font-weight:600; margin:0; }
  a { color: var(--teal); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
  header.site { display:flex; justify-content:space-between; align-items:center; padding:22px 28px; max-width:1080px; margin:0 auto; }
  .brand { font-family:'Fraunces',serif; font-weight:600; font-size:20px; text-decoration:none; color:var(--ink); display:flex; align-items:center; gap:9px; }
  .brand span { color: var(--teal); }
  .brand img { height: 30px; width: auto; display: block; }
  main { padding: 40px 0 90px; }
  h1.page-title { font-size: 34px; margin-bottom: 30px; }
  .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .blog-card { background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; text-decoration:none; color:var(--ink); display:block; }
  .blog-card img { width:100%; height:160px; object-fit:cover; display:block; background:#F0EDE3; }
  .blog-card .body { padding:16px; }
  .blog-card h3 { font-size:16px; }
  .blog-card p { font-size:13px; color:var(--sage); margin-top:8px; }
  .empty { color: var(--sage); font-size: 14px; }
  @media (max-width: 820px) { .blog-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site">
  <a href="/" class="brand" id="brand-link"><span>Baybex<span>AI</span></span></a>
</header>
<main class="wrap">
  <h1 class="page-title">Blog</h1>
  <div class="blog-grid" id="blog-grid"></div>
  <div class="empty" id="blog-empty" style="display:none;">No posts published yet.</div>
</main>
<script>
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }
async function load() {
  try {
    const siteRes = await fetch('/api/site-content');
    const site = await siteRes.json();
    if (site.favicon_url) document.getElementById('favicon-link').href = site.favicon_url;
    if (site.logo_url) document.getElementById('brand-link').innerHTML = '<img src="' + escapeHtml(site.logo_url) + '" alt="logo" />';
    if (site.primary_color) document.documentElement.style.setProperty('--teal', site.primary_color);
  } catch (e) {}
  const res = await fetch('/api/blog');
  const posts = await res.json();
  document.getElementById('blog-empty').style.display = posts.length ? 'none' : 'block';
  document.getElementById('blog-grid').innerHTML = posts.map(p =>
    '<a class="blog-card" href="/blog/' + encodeURIComponent(p.slug) + '">' +
      (p.cover_image_url ? '<img src="' + escapeHtml(p.cover_image_url) + '" alt="" />' : '') +
      '<div class="body"><h3>' + escapeHtml(p.title) + '</h3>' +
      (p.excerpt ? '<p>' + escapeHtml(p.excerpt) + '</p>' : '') + '</div>' +
    '</a>'
  ).join('');
}
load();
</script>
</body>
</html>
